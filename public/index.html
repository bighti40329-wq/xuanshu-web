<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2d1838">
  <title>玄樞八字｜AI 八字分析</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#faf7f0;color:#281f2a}
    .card{background:rgba(255,255,255,.94);border:1px solid #ead9b8;box-shadow:0 16px 40px rgba(55,33,64,.08)}
    .gold{color:#9b6b16}.purple{color:#3c2048}.btn{background:linear-gradient(135deg,#8e4f46,#403b58)}
    input,select,textarea{background:#fff;border:1px solid #decfb4;border-radius:.75rem;padding:.75rem;width:100%}
    input:focus,select:focus,textarea:focus{outline:2px solid #b88a3b;outline-offset:1px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<header class="border-b border-amber-200 bg-white/90 sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center gap-3">
    <div><h1 class="text-xl sm:text-2xl font-bold purple">玄樞八字</h1><p class="text-xs text-stone-500">一次 API 請求｜AI 八字排盤與解析</p></div>
    <button id="loadBtn" type="button" class="text-sm border border-amber-300 rounded-lg px-3 py-2">載入上次結果</button>
  </div>
</header>
<main class="max-w-5xl mx-auto p-4 sm:p-6 space-y-6">
  <section class="card rounded-2xl p-5 sm:p-7">
    <h2 class="text-xl font-bold purple mb-1">出生資料</h2>
    <p class="text-sm text-stone-500 mb-5">請盡量提供正確出生時間。結果屬傳統文化與自我探索參考，不宜作為醫療、法律或投資決策的唯一依據。</p>
    <form id="baziForm" class="space-y-5">
      <div class="grid sm:grid-cols-2 gap-4">
        <label class="text-sm">稱呼<input id="name" maxlength="40" placeholder="例如：李維軒"></label>
        <label class="text-sm">性別<select id="gender"><option value="未提供">不提供</option><option>男</option><option>女</option></select></label>
        <label class="text-sm">曆法<select id="calendar"><option value="國曆">國曆</option><option value="農曆">農曆</option></select></label>
        <label class="text-sm">出生日期<input id="birthDate" type="date" required></label>
        <label class="text-sm">出生時間<input id="birthTime" type="time" required></label>
        <label class="text-sm">出生地<input id="location" value="台灣嘉義縣梅山鄉" maxlength="80" required></label>
        <label class="text-sm sm:col-span-2">分析主題<select id="topic"><option>整體命格</option><option>工作事業</option><option>財運規劃</option><option>感情婚姻</option><option>學業考運</option><option>健康身心</option><option>近年流年</option></select></label>
        <label class="text-sm sm:col-span-2">具體問題（選填）<textarea id="question" rows="3" maxlength="300" placeholder="例如：想了解 2026～2027 年職涯轉換的合適方向。"></textarea></label>
      </div>
      <button id="submitBtn" class="btn w-full rounded-xl px-5 py-4 text-white font-bold text-lg" type="submit">☯ 開始 AI 八字分析</button>
      <p id="status" class="text-center text-sm text-stone-500" aria-live="polite">每次按下只呼叫 Gemini API 一次，不會自動重送。</p>
    </form>
  </section>

  <section id="result" class="hidden space-y-5">
    <div class="card rounded-2xl p-5 sm:p-7">
      <div class="flex flex-wrap justify-between gap-2 items-start"><div><p class="text-xs gold font-bold">AI 八字分析結果</p><h2 id="headline" class="text-2xl font-bold purple mt-1"></h2></div><span id="modelBadge" class="text-xs rounded-full bg-purple-100 text-purple-800 px-3 py-1"></span></div>
      <p id="summary" class="mt-4 leading-8 whitespace-pre-line"></p>
    </div>
    <div class="grid lg:grid-cols-2 gap-5">
      <div class="card rounded-2xl p-5"><h3 class="font-bold purple mb-3">四柱與日主</h3><div id="pillars" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div><p id="dayMaster" class="mt-4 text-sm leading-7"></p></div>
      <div class="card rounded-2xl p-5"><h3 class="font-bold purple mb-3">五行比例</h3><div id="elements" class="space-y-3"></div></div>
    </div>
    <div class="grid lg:grid-cols-2 gap-5">
      <div class="card rounded-2xl p-5"><h3 class="font-bold purple mb-3">格局重點</h3><ul id="strengths" class="list-disc pl-5 space-y-2"></ul></div>
      <div class="card rounded-2xl p-5"><h3 class="font-bold purple mb-3">需要留意</h3><ul id="cautions" class="list-disc pl-5 space-y-2"></ul></div>
    </div>
    <div class="card rounded-2xl p-5 sm:p-7"><h3 class="font-bold purple mb-3">針對問題的解析</h3><p id="topicReading" class="leading-8 whitespace-pre-line"></p><h3 class="font-bold purple mt-6 mb-3">行動建議</h3><ol id="actions" class="list-decimal pl-5 space-y-2"></ol></div>
  </section>
</main>
<script>
const API_URL="/api/ai/generate";
const form=document.getElementById("baziForm"),button=document.getElementById("submitBtn"),statusEl=document.getElementById("status");
const schema={type:"OBJECT",properties:{headline:{type:"STRING"},summary:{type:"STRING"},calendarConversion:{type:"STRING"},fourPillars:{type:"OBJECT",properties:{year:{type:"STRING"},month:{type:"STRING"},day:{type:"STRING"},hour:{type:"STRING"}},required:["year","month","day","hour"]},dayMaster:{type:"STRING"},dayMasterAnalysis:{type:"STRING"},fiveElements:{type:"OBJECT",properties:{wood:{type:"NUMBER"},fire:{type:"NUMBER"},earth:{type:"NUMBER"},metal:{type:"NUMBER"},water:{type:"NUMBER"}},required:["wood","fire","earth","metal","water"]},strengths:{type:"ARRAY",items:{type:"STRING"}},cautions:{type:"ARRAY",items:{type:"STRING"}},topicReading:{type:"STRING"},actions:{type:"ARRAY",items:{type:"STRING"}},disclaimer:{type:"STRING"}},required:["headline","summary","calendarConversion","fourPillars","dayMaster","dayMasterAnalysis","fiveElements","strengths","cautions","topicReading","actions","disclaimer"]};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function normalizeElements(e){const keys=["wood","fire","earth","metal","water"],vals=keys.map(k=>Math.max(0,Number(e?.[k])||0)),sum=vals.reduce((a,b)=>a+b,0)||1,out={};keys.forEach((k,i)=>out[k]=Math.round(vals[i]*100/sum));out.wood+=100-Object.values(out).reduce((a,b)=>a+b,0);return out;}
function payload(){const input={name:document.getElementById("name").value.trim()||"未提供",gender:document.getElementById("gender").value,calendar:document.getElementById("calendar").value,birthDate:document.getElementById("birthDate").value,birthTime:document.getElementById("birthTime").value,location:document.getElementById("location").value.trim(),timeZone:"Asia/Taipei",topic:document.getElementById("topic").value,question:document.getElementById("question").value.trim()||"無特定問題"};
const prompt=`請依下列資料進行一次完整八字分析。\n${JSON.stringify(input,null,2)}\n\n要求：以節氣判定月柱；清楚說明四柱、日主、五行比例、格局優勢與注意事項，並回答使用者問題。若資料不足要明確指出，不得假裝精確。五行比例合計100。使用繁體中文。`;
return{contents:[{parts:[{text:prompt}]}],systemInstruction:{parts:[{text:"你是傳統子平八字文化解讀助手。只處理八字，不處理紫微或西洋占星。內容僅供文化與自我探索參考，不得宣稱科學保證，不得提供醫療、法律或投資保證。輸出必須符合 JSON Schema。"}]},generationConfig:{responseMimeType:"application/json",responseSchema:schema,maxOutputTokens:3000,temperature:.25}};}
async function analyze(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),120000);try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload()),signal:controller.signal});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===429)throw new Error("今日 Gemini API 額度已用完，請於配額重置後再試。");throw new Error(j.detail||j.message||`HTTP ${r.status}`);}return{data:j.data||j,model:j.model||"Gemini"};}finally{clearTimeout(timer)}}
function render(data,model){data.fiveElements=normalizeElements(data.fiveElements);document.getElementById("headline").textContent=data.headline;document.getElementById("summary").textContent=`${data.summary}\n\n${data.calendarConversion}\n\n${data.disclaimer}`;document.getElementById("modelBadge").textContent=model;const p=data.fourPillars,labels=[["年柱",p.year],["月柱",p.month],["日柱",p.day],["時柱",p.hour]];document.getElementById("pillars").innerHTML=labels.map(x=>`<div class="rounded-xl bg-amber-50 border border-amber-200 p-3 text-center"><div class="text-xs text-stone-500">${x[0]}</div><div class="text-xl font-bold gold mt-1">${esc(x[1])}</div></div>`).join("");document.getElementById("dayMaster").textContent=`日主：${data.dayMaster}。${data.dayMasterAnalysis}`;const names={wood:"木",fire:"火",earth:"土",metal:"金",water:"水"};document.getElementById("elements").innerHTML=Object.entries(data.fiveElements).map(([k,v])=>`<div><div class="flex justify-between text-sm"><span>${names[k]}</span><span>${v}%</span></div><div class="h-2 bg-stone-200 rounded"><div class="h-2 bg-amber-600 rounded" style="width:${Math.max(0,Math.min(100,v))}%"></div></div></div>`).join("");document.getElementById("strengths").innerHTML=(data.strengths||[]).map(x=>`<li>${esc(x)}</li>`).join("");document.getElementById("cautions").innerHTML=(data.cautions||[]).map(x=>`<li>${esc(x)}</li>`).join("");document.getElementById("topicReading").textContent=data.topicReading;document.getElementById("actions").innerHTML=(data.actions||[]).map(x=>`<li>${esc(x)}</li>`).join("");document.getElementById("result").classList.remove("hidden");document.getElementById("result").scrollIntoView({behavior:"smooth"});localStorage.setItem("xuanshu_bazi_last",JSON.stringify({data,model,at:new Date().toISOString()}));}
form.addEventListener("submit",async e=>{e.preventDefault();if(!navigator.onLine){statusEl.textContent="目前離線，AI 分析需要網路連線。";return}button.disabled=true;button.textContent="正在進行 AI 八字分析…";statusEl.textContent="單次請求處理中，最多等待 120 秒，請勿重複點擊。";try{const x=await analyze();render(x.data,x.model);statusEl.textContent="分析完成，結果已保存在本機瀏覽器。";}catch(err){statusEl.textContent=err.name==="AbortError"?"分析超過 120 秒，已停止且不會自動重送。":`分析失敗：${err.message}`;}finally{button.disabled=false;button.textContent="☯ 開始 AI 八字分析";}});
document.getElementById("loadBtn").addEventListener("click",()=>{try{const x=JSON.parse(localStorage.getItem("xuanshu_bazi_last"));if(!x)throw 0;render(x.data,x.model);statusEl.textContent="已載入上次儲存結果。";}catch{statusEl.textContent="找不到可載入的上次結果。";}});
</script>
</body>
</html>
